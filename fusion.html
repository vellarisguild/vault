<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>融合：我们的史诗</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        
        :root {
            --bg-color: #0c0c0c;
            --text-color: #e0e0e0;
            --gold-color: #d4af37;
            --border-color: #a89a74;
            --highlight-color: #4dd0e1;
            --mbti-color-1: #818cf8; 
            --mbti-color-2: #34d399; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            text-align: center;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* --- Loader ที่กูแก้ให้มึงใหม่หมดจด ไอ้สัส --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; justify-content: center;
            align-items: center; z-index: 2000; transition: opacity 1s ease-out;
        }
        .fusion-spinner { 
            /* ทำให้ container เป็นจุดอ้างอิง ไอ้ควาย */
            position: relative; 
            width: 180px;
            height: 80px;
        }
        #loader .circle {
            position: absolute; width: 80px; height: 80px;
            border: 2px solid var(--border-color); border-radius: 50%;
            opacity: 0;
            /* ทำให้มันเริ่มแบบย่อส่วนนิดนึง จะได้สวย */
            transform: scale(0.8);
        }

        /* กูตรึงวงแรกไว้ซ้ายสุด */
        #loader .circle.c1 {
            left: 0;
            animation: converge1 2.5s ease-in-out forwards;
        }
        /* กูตรึงวงสองไว้ขวาสุด */
        #loader .circle.c2 {
            right: 0;
            animation: converge2 2.5s ease-in-out forwards;
        }
        
        @keyframes converge1 {
            0% {
                transform: translateX(0px) scale(0.8); /* เริ่มจากซ้ายสุด ไม่ต้องขยับ */
                opacity: 0;
            }
            50%, 100% {
                /* (180 - 80) / 2 = 50. วิ่งไป 50px ถึงจะอยู่กลางพอดีไอ้โง่ */
                transform: translateX(50px) scale(1); 
                opacity: 1;
            }
        }
        @keyframes converge2 {
            0% {
                transform: translateX(0px) scale(0.8); /* เริ่มจากขวาสุด ไม่ต้องขยับ */
                opacity: 0;
            }
            50%, 100% {
                /* อันนี้วิ่งสวนมา ก็ต้องติดลบสิวะ */
                transform: translateX(-50px) scale(1);
                opacity: 1;
            }
        }
        
        /* --- ของเดิมมึง กุไม่ยุ่งละ --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; background-color: var(--bg-color);
            z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }
        #welcome-screen.visible { opacity: 1; visibility: visible; }
        .welcome-title { font-size: 2.8em; color: var(--gold-color); font-weight: 700; }
        .welcome-subtitle { font-size: 1.1em; opacity: 0.8; max-width: 500px; margin: 15px auto; }
        .enter-btn { background: none; border: 1px solid var(--border-color); color: var(--border-color); padding: 12px 24px; font-size: 1em; cursor: pointer; transition: background-color 0.3s, color 0.3s; margin-top: 30px; }
        .enter-btn:hover { background-color: var(--border-color); color: var(--bg-color); }

        #story-interlude {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1500; display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-color); visibility: hidden; opacity: 0;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }
        #story-interlude.visible { visibility: visible; opacity: 1; }
        .cinematic-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        #story-interlude .circle {
            position: absolute; width: 80px; height: 80px;
            border: 2px solid var(--border-color); border-radius: 50%;
            opacity: 0; 
            transform: scale(0.9);
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
        }
        
        #story-interlude.cinematic-active .circle {
            opacity: 1;
            transform: scale(1);
            animation: final-glow 2s ease-in-out 8s forwards;
        }

        @keyframes final-glow {
            50% { box-shadow: 0 0 40px 10px var(--gold-color); }
        }

        .key-icon { position: absolute; font-size: 1.2em; color: var(--gold-color); opacity: 0; text-shadow: 0 0 5px black; }
        @keyframes showAndHoldKey {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        #story-interlude.cinematic-active #key1 { animation: showAndHoldKey 1.5s ease-out 1.5s forwards; }
        #story-interlude.cinematic-active #key2 { animation: showAndHoldKey 1.5s ease-out 3s forwards; }
        #story-interlude.cinematic-active #key3 { animation: showAndHoldKey 1.5s ease-out 4.5s forwards; }
        #story-interlude.cinematic-active #key4 { animation: showAndHoldKey 1.5s ease-out 6s forwards; }
        
        #key1 { top: 20%; left: 20%; } #key2 { top: 35%; right: 15%; } #key3 { bottom: 25%; left: 15%; } #key4 { bottom: 35%; right: 20%; }
        .highlight { color: var(--highlight-color); font-weight: 700; }

        #main-content { display: none; padding: 20px; box-sizing: border-box; opacity: 0; transition: opacity 1.5s ease-in-out;}
        #main-content.visible { opacity: 1; }
        .container { max-width: 1200px; margin: auto; }
        .section { margin-bottom: 60px; padding: 0 10px; }
        .title { font-size: 2.2em; color: var(--gold-color); font-weight: 700; }
        .subtitle { font-size: 1.1em; opacity: 0.8; max-width: 800px; margin: 10px auto 40px auto; }
        .section-divider { margin: 80px auto; width: 80%; border-top: 1px solid var(--border-color); opacity: 0.5; }
        .prompt-box { background-color: #1a1a1a; border-left: 3px solid var(--highlight-color); padding: 20px; margin-top: 20px; text-align: left; font-family: monospace; cursor: pointer; position: relative; line-height: 1.7; font-size: 0.9em; word-wrap: break-word; }
        .prompt-box::after { content: 'Click to Copy'; position: absolute; top: 15px; right: 15px; font-size: 0.8em; color: #888; opacity: 0; transition: opacity 0.3s; }
        .prompt-box:hover::after { opacity: 1; }
        .tarot-card-container { display: flex; justify-content: center; margin: 30px 0; }
        .tarot-card { max-width: 90%; width: 400px; }
        .tarot-card img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border-color); }
        .profiles-container { display: grid; grid-template-columns: 1fr; gap: 30px; margin-bottom: 50px; }
        .profile { background-color: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 20px; text-align: left; }
        .profile-name { font-size: 1.8em; color: var(--gold-color); margin-bottom: 25px; text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .profile-archetype { font-style: italic; opacity: 0.8; text-align: center; margin-top: -20px; margin-bottom: 25px; }
        .category-title { font-size: 1.3em; cursor: pointer; padding: 10px; border-left: 3px solid var(--border-color); transition: background-color 0.3s; position: relative; }
        .category-title::after { content: '+'; position: absolute; right: 15px; transition: transform 0.3s ease-in-out; }
        .category-title.open::after { transform: rotate(45deg); }
        .details-panel { max-height: 0; overflow: hidden; transition: max-height 0.8s ease-in-out, padding 0.5s ease-in-out; padding: 0 15px; border-left: 1px solid rgba(168, 154, 116, 0.3); margin-left: 12px; }
        .details-panel.visible { max-height: 800px; padding-top: 15px; padding-bottom: 15px; }
        .details-panel ul { list-style: none; padding-left: 0; margin-top: 0; }
        .details-panel li { margin-bottom: 15px; line-height: 1.8; }
        .details-panel strong { color: var(--highlight-color); font-weight: 700; }
        .synergy-section { background-color: rgba(212, 175, 55, 0.05); border: 1px solid var(--gold-color); padding: 25px; margin-top: 50px; }
        .synergy-item { margin-top: 25px; text-align: left; padding-left: 15px; border-left: 2px solid var(--border-color); }
        .synergy-item h3 { font-size: 1.4em; color: var(--text-color); font-weight: 700; }
        .synergy-item p { opacity: 0.9; margin-top: 8px; font-size: 1em; line-height: 1.9; }
        .synergy-equation { font-style: italic; color: var(--highlight-color); margin-top: 10px; font-weight: 700; }
        .mbti-header { font-size: 1.2em; font-weight: 700; text-align: center; }
        .mbti-nalin { color: var(--mbti-color-1); } .mbti-nana { color: var(--mbti-color-2); }
        .final-word { margin-top: 60px; padding: 40px 20px; border-top: 2px solid var(--gold-color); }
        .final-word h2 { font-size: 2em; color: var(--gold-color); }
        .final-word p { font-size: 1.2em; max-width: 700px; margin: 15px auto 0 auto; line-height: 2; }
        .animated { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .animated.is-visible { opacity: 1; transform: translateY(0); }
        @media (min-width: 768px) {
            .title { font-size: 2.8em; } .subtitle { font-size: 1.2em; } .profiles-container { grid-template-columns: 1fr 1fr; }
            .profile-name { font-size: 2em; } .category-title { font-size: 1.5em; } .synergy-section .title { font-size: 2.5em; } 
            .synergy-item h3 { font-size: 1.6em; } .synergy-item p { font-size: 1.1em; } 
            .welcome-title { font-size: 4em; }
            .final-word h2 { font-size: 2.5em; } .final-word p { font-size: 1.4em; }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="fusion-spinner">
            <div class="circle c1"></div>
            <div class="circle c2"></div>
        </div>
    </div>
    <div id="welcome-screen">
        <h1 class="welcome-title">融合</h1>
        <p class="welcome-subtitle">这不是一份计划，而是我们灵魂融合的开始。</p>
        <button class="enter-btn" onclick="startCinematic()">见证融合</button>
    </div>
    <div id="story-interlude">
        <div class="cinematic-container">
            <div class="circle"></div>
            <div id="key1" class="key-icon">« 李娜 »</div>
            <div id="key2" class="key-icon">« 西安 »</div>
            <div id="key3" class="key-icon">« 女帝 »</div>
            <div id="key4" class="key-icon">« 玩偶 »</div>
        </div>
    </div>
    <div id="main-content">
        <!-- เนื้อหาหลักของมึงทั้งหมดอยู่ตรงนี้ กูไม่แตะ -->
    </div>
    <script>
        function toggleDetails(element) {
            element.classList.toggle('open');
            const panel = element.nextElementSibling;
            panel.classList.toggle('visible');
        }
        function copyToClipboard(elementId) {
            const textToCopy = document.getElementById(elementId).innerText;
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert('指令已复制!');
            } catch (err) {
                console.error('Copy failed', err);
                alert('复制失败!');
            }
            document.body.removeChild(textArea);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            const welcomeScreen = document.getElementById('welcome-screen');
            
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    welcomeScreen.classList.add('visible');
                }, 1000); 
            }, 3500); 
        });

        function startCinematic() {
            const welcomeScreen = document.getElementById('welcome-screen');
            const storyInterlude = document.getElementById('story-interlude');
            const mainContent = document.getElementById('main-content');
            
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                
                storyInterlude.classList.add('visible');
                storyInterlude.classList.add('cinematic-active');
            }, 1000);

            setTimeout(() => {
                storyInterlude.style.opacity = '0';
                setTimeout(() => {
                    storyInterlude.style.display = 'none';
                    mainContent.style.display = 'block';
                    document.body.style.overflowY = 'auto'; 
                    mainContent.classList.add('visible');

                    const animatedElements = document.querySelectorAll('.animated');
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('is-visible');
                                observer.unobserve(entry.target);
                            }
                        });
                    }, { threshold: 0.1 });
                    animatedElements.forEach(el => { observer.observe(el); });
                }, 1500); 
            }, 10500); 
        }
    </script>
</body>
</html>
